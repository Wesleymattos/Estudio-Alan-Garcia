<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login e Agenda | Studio Alan Garcia</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body class="login-body">


  <div class="login-shell">


    <!-- =====================================================
         PAINEL DA MARCA
    ====================================================== -->

    <section class="login-brand-panel">

      <a
        href="index.html"
        class="brand brand-logo login-logo"
        data-link
      >

        <img
          src="assets/logo-alan-garcia.png"
          alt="Studio Alan Garcia"
        >

      </a>


      <div>

        <p class="eyebrow">
          ÁREA ADMINISTRATIVA
        </p>


        <h1>
          Agenda
          <br>
          <span>online.</span>
        </h1>


        <p>
          Organize horários e acompanhe os
          agendamentos em um único lugar.
        </p>

      </div>

    </section>



    <!-- =====================================================
         PAINEL DE LOGIN
    ====================================================== -->

    <section class="login-panel">


      <!-- ===================================================
           LOGIN
      ==================================================== -->

      <div id="loginView">

        <p class="eyebrow">
          ACESSO
        </p>


        <h2>
          Entrar
        </h2>


        <form
          id="loginForm"
          class="login-form"
        >


          <!-- E-MAIL -->

          <label>

            E-mail

            <input
              id="loginEmail"
              type="email"
              required
              autocomplete="email"
              placeholder="seu@email.com"
            >

          </label>



          <!-- SENHA -->

          <label>

            Senha

            <input
              id="loginPassword"
              type="password"
              required
              autocomplete="current-password"
              placeholder="Digite sua senha"
            >

          </label>



          <!-- BOTÃO -->

          <button
            class="btn btn-primary"
            type="submit"
          >

            Entrar na agenda

          </button>



          <!-- MENSAGEM -->

          <p
            id="loginMessage"
            class="form-message"
          ></p>


        </form>

      </div>



      <!-- ===================================================
           AGENDA
      ==================================================== -->

      <div
        id="agendaView"
        hidden
      >


        <!-- CABEÇALHO DA AGENDA -->

        <div class="agenda-top">

          <div>

            <p class="eyebrow">
              PAINEL
            </p>

            <h2>
              Agenda
            </h2>

          </div>


          <button
            id="logoutBtn"
            class="btn btn-small"
            type="button"
          >

            Sair

          </button>

        </div>



        <!-- STATUS FIREBASE -->

        <div
          class="firebase-status"
          id="firebaseStatus"
        >

          Verificando Firebase...

        </div>



        <!-- =================================================
             FORMULÁRIO DE AGENDAMENTO
        ================================================== -->

        <form
          id="appointmentForm"
          class="appointment-form"
        >


          <!-- NOME -->

          <label>

            Nome

            <input
              id="clientName"
              required
              placeholder="Nome do aluno"
            >

          </label>



          <!-- DATA -->

          <label>

            Data

            <input
              id="appointmentDate"
              type="date"
              required
            >

          </label>



          <!-- HORÁRIO -->

          <label>

            Horário

            <input
              id="appointmentTime"
              type="time"
              required
            >

          </label>



          <!-- SERVIÇO -->

          <label>

            Serviço

            <select id="appointmentService">

              <option value="Treino personalizado">
                Treino personalizado
              </option>

              <option value="Aula experimental">
                Aula experimental
              </option>

              <option value="Avaliação">
                Avaliação
              </option>

            </select>

          </label>



          <!-- OBSERVAÇÃO -->

          <label class="full">

            Observação

            <input
              id="appointmentNotes"
              placeholder="Opcional"
            >

          </label>



          <!-- BOTÃO -->

          <button
            class="btn btn-primary full"
            type="submit"
          >

            Adicionar à agenda

          </button>


        </form>



        <!-- =================================================
             LISTA DE HORÁRIOS
        ================================================== -->

        <div class="agenda-toolbar">

          <h3>
            Próximos horários
          </h3>


          <button
            id="clearDemoBtn"
            class="text-button"
            type="button"
          >

            Limpar agenda local

          </button>

        </div>



        <div
          id="appointmentList"
          class="appointment-list"
        ></div>


      </div>


    </section>


  </div>



  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script
    type="module"
    src="js/login.js"
  ></script>


</body>

</html>
